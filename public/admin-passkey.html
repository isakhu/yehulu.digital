<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#050505">
  <title>Admin Login — Yehulu Digital</title>
  <style>
    :root{color-scheme:dark;--lime:#b6ff00;--bg:#050505;--panel:#0c0c0c;--muted:#929292}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#18220a 0%,transparent 47%),var(--bg);color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}
    .shell{width:min(100%,440px);border:1px solid #ffffff18;background:linear-gradient(145deg,#111 0%,#080808 66%);padding:clamp(28px,6vw,46px);box-shadow:0 32px 100px #000b}
    .brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:38px}
    .mark{width:38px;height:38px;border:1px solid var(--lime);display:grid;place-items:center;color:var(--lime);font-size:16px;font-weight:950;letter-spacing:-2px}
    .brand-name{font-weight:900;letter-spacing:.18em;font-size:12px;text-transform:uppercase}
    .eyebrow{color:var(--lime);font-size:10px;font-weight:900;letter-spacing:.24em;text-transform:uppercase;text-align:center}
    h1{text-align:center;font-size:clamp(27px,7vw,35px);line-height:1.08;letter-spacing:-.045em;margin:12px 0}
    .intro{text-align:center;color:#a6a6a6;font-size:13px;line-height:1.7;margin:0 auto 30px;max-width:310px}
    label{display:block;color:#bcbcbc;font-size:10px;font-weight:850;letter-spacing:.16em;text-transform:uppercase;margin:0 0 10px}
    input{width:100%;height:54px;border:1px solid #ffffff25;background:#080808;color:#fff;padding:0 16px;font:inherit;font-size:16px;outline:none;transition:border-color .18s}
    input:focus{border-color:var(--lime)}
    input::placeholder{color:#666}
    .action{width:100%;min-height:54px;border:0;background:var(--lime);color:#050505;font-size:11px;font-weight:950;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;margin-top:18px;transition:background .18s,transform .18s}
    .action:hover{background:#fff;transform:translateY(-1px)}
    .action:disabled{opacity:.55;cursor:not-allowed;transform:none}
    .status{min-height:42px;margin-top:16px;padding:12px 14px;border:1px solid #ffffff17;background:#ffffff06;color:#aaa;font-size:12px;line-height:1.55;text-align:center}
    .status.error{border-color:#713333;color:#ffaaaa;background:#2b0d0d66}
    .status.success{border-color:#466400;color:var(--lime);background:#b6ff0010}
    .back{display:block;margin-top:26px;text-align:center;color:#777;font-size:10px;font-weight:800;letter-spacing:.14em;text-decoration:none;text-transform:uppercase}
    .back:hover{color:var(--lime)}
    .footer{margin-top:34px;text-align:center;color:#606060;font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand" aria-label="Yehulu Digital">
      <div class="mark">Y.</div>
      <div class="brand-name">Yehulu Digital</div>
    </div>
    <div class="eyebrow">Owner workspace</div>
    <h1>Welcome back.</h1>
    <p class="intro">Enter your admin password to manage Yehulu Digital projects, images, videos, and links.</p>

    <form id="loginForm" autocomplete="on">
      <label for="password">Admin password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required autofocus>
      <button id="submitButton" class="action" type="submit">Sign in</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite">Enter your password to continue.</div>
    <a class="back" href="/">← Return to public website</a>
    <div class="footer">Yehulu Digital · Private administration</div>
  </main>

  <script>
    (function () {
      const form = document.getElementById('loginForm');
      const passwordInput = document.getElementById('password');
      const submitButton = document.getElementById('submitButton');
      const statusBox = document.getElementById('status');

      function setStatus(message, type) {
        statusBox.textContent = message;
        statusBox.className = 'status' + (type ? ' ' + type : '');
      }

      async function checkExistingSession() {
        const token = localStorage.getItem('admin_token');
        if (!token) return;
        try {
          const response = await fetch('/api/auth/me', {
            headers: { Authorization: 'Bearer ' + token },
            cache: 'no-store'
          });
          if (response.ok) location.replace('/admin');
          else localStorage.removeItem('admin_token');
        } catch (_) {
          // Keep the login form available when the network is temporarily unavailable.
        }
      }

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        const password = passwordInput.value;
        if (!password) {
          setStatus('Enter your admin password.', 'error');
          passwordInput.focus();
          return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'Signing in…';
        setStatus('Checking password…');

        try {
          const response = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'same-origin',
            cache: 'no-store',
            body: JSON.stringify({ password })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok || !result.token) {
            throw new Error(result.error || 'Sign-in failed. Check your password and try again.');
          }

          // Verify the session before navigating so API auth issues are shown on this page.
          const sessionCheck = await fetch('/api/auth/me', {
            headers: { Authorization: 'Bearer ' + result.token },
            credentials: 'same-origin',
            cache: 'no-store'
          });
          if (!sessionCheck.ok) {
            const sessionError = await sessionCheck.json().catch(() => ({}));
            throw new Error(sessionError.error || 'The password was accepted, but the admin session could not be verified. Please try again.');
          }

          localStorage.setItem('admin_token', result.token);
          setStatus('Access granted. Opening your workspace…', 'success');
          location.replace('/admin');
        } catch (error) {
          setStatus(error.message || 'Sign-in failed. Please try again.', 'error');
          passwordInput.select();
        } finally {
          submitButton.disabled = false;
          submitButton.textContent = 'Sign in';
        }
      });

      checkExistingSession();
      passwordInput.focus();
    })();
  </script>
</body>
</html>
