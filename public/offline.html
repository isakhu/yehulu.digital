<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>You're offline — Yehulu Digital</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      background-color:#050505;color:#fff;font-family:Arial,sans-serif;text-align:center;
      background-image:
        linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px),
        radial-gradient(ellipse 65% 50% at 50% 40%,rgba(100,180,0,.07) 0%,transparent 70%);
      background-size:54px 45px,54px 45px,auto;
      background-attachment:fixed,fixed,fixed;
    }
    main{max-width:440px}
    img{width:110px;height:110px;object-fit:contain;margin-bottom:28px}
    .eyebrow{color:#B6FF00;font-size:11px;font-weight:800;letter-spacing:.25em;text-transform:uppercase}
    h1{font-size:clamp(30px,7vw,48px);line-height:1.05;text-transform:uppercase;margin:14px 0}
    p{color:#a1a1aa;line-height:1.7;font-size:14px}
    button{margin-top:18px;padding:14px 22px;border:1px solid #B6FF00;background:#B6FF00;color:#050505;font-weight:800;text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/assets/logopng-BhI97nKv.png" alt="Yehulu Digital">
    <div class="eyebrow">Yehulu Digital</div>
    <h1>You're offline.</h1>
    <p>This page needs an internet connection. Reconnect and try again to view the latest projects, videos, and courses.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
