<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Yehulu Digital — Creative Digital Agency</title>
    <meta name="description" content="Yehulu Digital is a creative digital agency focused on branding, visual content, video production, social media campaigns, and digital product experiences." />
    <meta name="theme-color" content="#050505" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Yehulu Digital" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/logopng-BhI97nKv.png" />
    <link rel="icon" type="image/png" href="/assets/logopng-BhI97nKv.png" />

    <!-- Google Fonts: Bricolage Grotesque & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800;12..96,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Theme Initialization Script (Zero-FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('yehulu_theme');
          var theme = saved || 'dark'; // Dark is client approved default
          document.documentElement.setAttribute('data-theme', theme);
        } catch(e) {}
      })();
    </script>

    <!-- GSAP (loaded before React for smooth entry) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- Global Styles & Tight Spacing Design Tokens -->
    <style>
      :root, [data-theme="dark"] {
        --bg-main: #050505;
        --bg-card: #0a0a0a;
        --bg-sub: #111111;
        --text-main: #ffffff;
        --text-muted: #a1a1aa;
        --text-sub: #71717a;
        --border-main: rgba(255, 255, 255, 0.08);
        --border-highlight: rgba(188, 255, 0, 0.35);
        --brand-accent: #B6FF00;
        --brand-text: #050505;
        --dock-bg: rgba(10, 10, 10, 0.88);
        --dock-border: rgba(188, 255, 0, 0.25);
        --dock-shadow: 0 12px 32px rgba(0, 0, 0, 0.7), 0 0 16px rgba(182, 255, 0, 0.12);
        --topbar-bg: rgba(5, 5, 5, 0.92);
        color-scheme: dark;
      }

      [data-theme="light"] {
        --bg-main: #f6f8f4;
        --bg-card: #ffffff;
        --bg-sub: #edf1e8;
        --text-main: #0c1109;
        --text-muted: #4b5545;
        --text-sub: #6c7566;
        --border-main: rgba(0, 0, 0, 0.08);
        --border-highlight: rgba(143, 199, 0, 0.45);
        --brand-accent: #8ec900;
        --brand-text: #000000;
        --dock-bg: rgba(255, 255, 255, 0.92);
        --dock-border: rgba(0, 0, 0, 0.12);
        --dock-shadow: 0 12px 32px rgba(0, 0, 0, 0.1), 0 0 16px rgba(142, 201, 0, 0.1);
        --topbar-bg: rgba(246, 248, 244, 0.94);
        color-scheme: light;
      }

      *, *::before, *::after { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        background-color: var(--bg-main);
        color: var(--text-main);
        font-family: 'Plus Jakarta Sans', sans-serif;
        transition: background-color 0.25s ease, color 0.25s ease;
        padding-bottom: 74px; /* Tight compact spacing for floating dock */
        cursor: auto !important; /* Native cursor preserved */
      }

      ::selection {
        background-color: #B6FF00;
        color: #000000;
      }

      /* ── Page Loader ── */
      #yeh-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: var(--bg-main);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        pointer-events: all;
        transition: opacity 0.4s ease;
      }
      #yeh-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* Last-resort escape hatch: a broken animation script must never trap visitors. */
      @keyframes yd-loader-auto-dismiss {
        to { opacity: 0; visibility: hidden; pointer-events: none; }
      }
      /* The loader has repeatedly trapped real visitors on the splash screen.
         Remove it from rendering entirely; the React app and static navigation must
         remain visible even if a third-party script or bundle fails. */
      #yeh-loader {
        display: none !important;
        animation: none !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        #yeh-loader { display: none !important; animation: none !important; }
      }
      .loader-logo {
        width: 120px;
        object-fit: contain;
        animation: logoPulse 1.2s ease-in-out infinite alternate;
        filter: drop-shadow(0 0 20px rgba(182, 255, 0, 0.35));
      }
      @keyframes logoPulse {
        from { opacity: .7; transform: scale(.98); }
        to   { opacity: 1;  transform: scale(1.02); }
      }
      .loader-bar-wrap {
        width: 150px;
        height: 2px;
        background: var(--border-main);
        overflow: hidden;
        position: relative;
      }
      .loader-bar {
        position: absolute;
        top: 0; left: -100%;
        height: 100%;
        width: 100%;
        background: #B6FF00;
        animation: loaderSlide 1s ease-in-out infinite;
      }
      @keyframes loaderSlide {
        0%   { left: -100%; }
        50%  { left: 0;    }
        100% { left: 100%; }
      }
      .loader-tag {
        font-family: 'Courier New', monospace;
        font-size: 9px;
        letter-spacing: .3em;
        text-transform: uppercase;
        color: #B6FF00;
      }

      /* ── Scroll Progress Bar ── */
      #yeh-progress {
        position: fixed;
        top: 0; left: 0;
        height: 2px;
        width: 0%;
        background: linear-gradient(90deg, #B6FF00, #95db00);
        z-index: 99998;
        pointer-events: none;
        transition: width .05s linear;
        box-shadow: 0 0 8px rgba(182,255,0,.5);
      }

      /* ── Topbar Optimization & Clean Tight Spacing ── */
      header nav.hidden.md\:flex,
      header .md\:hidden {
        display: none !important;
      }
      header {
        background-color: var(--topbar-bg) !important;
        border-bottom: 1px solid var(--border-main) !important;
        padding-top: 10px !important;
        padding-bottom: 10px !important;
      }

      /* Topbar Actions Container */
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* ── UNIFIED SOCIAL MEDIA HUB (All Logos in One Place) ── */
      .social-media-hub {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        background: var(--dock-bg);
        border: 1px solid var(--border-main);
        padding: 3px 5px;
        border-radius: 999px;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      }

      .social-hub-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 999px;
        color: var(--text-muted);
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .social-hub-link:hover {
        color: #B6FF00;
        background: rgba(182, 255, 0, 0.1);
        transform: translateY(-1.5px) scale(1.08);
      }
      .social-hub-link svg {
        width: 15px;
        height: 15px;
      }

      /* Theme Switcher Button */
      .theme-toggle-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        border-radius: 999px;
        background: var(--dock-bg);
        border: 1px solid var(--border-main);
        color: var(--text-main);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        transition: all 0.2s ease;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        cursor: pointer;
      }
      .theme-toggle-btn:hover {
        border-color: #B6FF00;
        color: #B6FF00;
        transform: translateY(-1.5px);
      }
      .theme-toggle-btn svg {
        width: 16px;
        height: 16px;
        transition: transform 0.3s ease;
      }
      .theme-toggle-btn:hover svg {
        transform: rotate(20deg);
      }

      /* ── FIXED BOTTOM APP NAVIGATION ── */
      #floating-dock {
        position: fixed;
        left: 50%;
        bottom: calc(12px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 9990;
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        align-items: center;
        gap: 2px;
        width: min(680px, calc(100vw - 16px));
        padding: 6px;
        background: var(--dock-bg);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--dock-border);
        border-radius: 999px;
        box-shadow: var(--dock-shadow);
      }

      .dock-item {
        position: relative;
        min-width: 0;
        width: auto;
        height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        color: var(--text-muted);
        text-decoration: none;
        transition: color .2s ease, background .2s ease, transform .2s ease;
        outline: none;
      }
      .dock-item:hover,
      .dock-item:focus-visible {
        color: var(--text-main);
        background: rgba(255,255,255,.08);
        transform: translateY(-2px);
      }
      [data-theme="light"] .dock-item:hover,
      [data-theme="light"] .dock-item:focus-visible {
        background: rgba(0,0,0,.05);
      }
      .dock-item svg {
        width: 19px;
        height: 19px;
        stroke-width: 2;
      }
      .dock-item.active {
        background: #B6FF00 !important;
        color: #000 !important;
        transform: translateY(-1px) scale(1.04);
        box-shadow: 0 0 16px rgba(182,255,0,.35);
      }
      .dock-tooltip {
        position: absolute;
        bottom: calc(100% + 8px);
        left: 50%;
        transform: translateX(-50%) translateY(3px);
        background: var(--bg-card);
        color: var(--text-main);
        font-family: 'Courier New', monospace;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: .1em;
        text-transform: uppercase;
        padding: 4px 8px;
        border-radius: 5px;
        border: 1px solid var(--border-highlight);
        pointer-events: none;
        white-space: nowrap;
        opacity: 0;
        box-shadow: 0 6px 20px rgba(0,0,0,.35);
        transition: opacity .15s ease, transform .15s ease;
      }
      .dock-tooltip::after {
        content: '';
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 3px solid transparent;
        border-top-color: var(--bg-card);
      }
      .dock-item:hover .dock-tooltip,
      .dock-item:focus-visible .dock-tooltip {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* Public navigation lives at the bottom; keep only the logo and controls in the top bar. */
      #root header nav,
      #root header a[href="/contact"],
      #root header button[aria-label="Toggle menu"] {
        display: none !important;
      }
      .social-media-hub { display: none !important; }
      body:not([data-yd-admin="true"]) #root main { padding-bottom: 94px; }
      body[data-yd-admin="true"] #floating-dock { display: none !important; }

      /* The homepage, services and estimator are separate full-screen views. */
      body[data-yd-view="home"] #root main > #home > *:not(:first-child),
      body[data-yd-view="services"] #root main > #home > *:not(#services):not(.fixed.inset-0),
      body[data-yd-view="estimate"] #root main > #home > *:not(#yd-estimate-page):not(.fixed.inset-0) {
        display: none !important;
      }
      body[data-yd-view="projects"] .yd-project-image-card {
        opacity: 0;
        transform: perspective(900px) translateY(28px) rotateX(5deg) scale(.96);
        transition: opacity .75s ease, transform .85s cubic-bezier(.2,.75,.2,1);
        transition-delay: var(--yd-project-delay, 0ms);
        transform-origin: center bottom;
      }
      body[data-yd-view="projects"] .yd-project-image-card.yd-project-revealed {
        opacity: 1;
        transform: perspective(900px) translateY(0) rotateX(0) scale(1);
      }
      @media (prefers-reduced-motion: reduce) {
        body[data-yd-view="projects"] .yd-project-image-card,
        body[data-yd-view="projects"] .yd-project-image-card img {
          opacity: 1 !important;
          transform: none !important;
          animation: none !important;
          transition: none !important;
        }
      }
      body[data-yd-view="home"] #root footer {
        display: none !important;
      }

      /* ── SERVICE DOORS: tall arched doors inspired by the supplied reference ── */
      body[data-yd-view="services"] #services {
        padding-top: clamp(3rem, 7vh, 5.5rem) !important;
        padding-bottom: 7rem !important;
      }
      body[data-yd-view="services"] #services > div:first-child {
        margin-bottom: clamp(2rem, 5vh, 3.5rem) !important;
      }
      body[data-yd-view="services"] #services .grid {
        display: grid !important;
        grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
        align-items: end;
        gap: clamp(12px, 1.5vw, 20px) !important;
      }
      body[data-yd-view="services"] #services .grid > div.yd-service-door-card {
        --yd-door-face: var(--bg-sub);
        --yd-door-edge: var(--bg-card);
        position: relative !important;
        isolation: isolate;
        overflow: hidden !important;
        display: flex !important;
        align-items: stretch;
        min-width: 0;
        min-height: 365px;
        padding: 0 !important;
        border: 1px solid var(--border-main) !important;
        border-radius: 112px 112px 8px 8px !important;
        background: linear-gradient(180deg, var(--bg-sub) 0%, var(--bg-card) 100%) !important;
        box-shadow: 0 22px 54px rgba(0,0,0,.32), inset 0 0 0 1px rgba(255,255,255,.035);
        perspective: 1500px;
        transform: translateY(0);
        cursor: pointer;
        transition: transform .45s cubic-bezier(.2,.75,.25,1), box-shadow .45s ease, border-color .35s ease;
      }
      body[data-yd-view="services"] #services .grid > div.yd-service-door-card:hover,
      body[data-yd-view="services"] #services .grid > div.yd-service-door-card:focus-visible {
        z-index: 8;
        transform: translateY(-6px);
        border-color: var(--border-highlight) !important;
        box-shadow: 0 28px 64px rgba(0,0,0,.46), 0 0 26px rgba(182,255,0,.1);
        outline: none;
      }
      body[data-yd-view="services"] .yd-service-door-card::before {
        content: attr(data-door-number) "  /  " attr(data-door-title) "\A\A OPEN THE DOOR  ↗";
        white-space: pre-line;
        position: absolute;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding: 0 13px 43px;
        border-radius: inherit;
        color: #fff;
        text-align: center;
        font-family: 'Bricolage Grotesque', sans-serif;
        font-size: clamp(10px, .86vw, 13px);
        font-weight: 900;
        line-height: 1.8;
        letter-spacing: .12em;
        text-transform: uppercase;
        text-shadow: 0 2px 12px rgba(0,0,0,.35);
        background-color: var(--yd-door-face);
        background-image:
          radial-gradient(circle at calc(100% - 27px) 56%, var(--brand-accent) 0 3px, color-mix(in srgb, var(--brand-accent) 55%, var(--bg-main)) 4px 5px, transparent 7px),
          linear-gradient(90deg, rgba(255,255,255,.1), transparent 13%, transparent 82%, rgba(0,0,0,.18)),
          linear-gradient(180deg, rgba(255,255,255,.06), transparent 42%, rgba(0,0,0,.1)),
          repeating-linear-gradient(0deg, transparent 0 74px, var(--border-main) 75px, transparent 77px),
          linear-gradient(135deg, var(--yd-door-face), var(--yd-door-edge));
        border: 1px solid var(--border-main);
        box-shadow:
          inset 0 0 0 10px rgba(0,0,0,.065),
          inset 0 0 0 12px rgba(255,255,255,.1),
          inset 0 0 0 14px rgba(0,0,0,.08),
          inset 0 -24px 48px rgba(0,0,0,.14),
          10px 0 18px rgba(0,0,0,.16);
        transform-origin: left center;
        transform: perspective(1500px) rotateY(0deg);
        transform-style: preserve-3d;
        backface-visibility: hidden;
        will-change: transform;
        transition: transform 1.05s cubic-bezier(.2,.75,.2,1), filter .65s ease, opacity .65s ease;
      }
      body[data-yd-view="services"] .yd-service-door-card::after {
        content: "";
        position: absolute;
        inset: 12px 10px 10px;
        z-index: 6;
        border: 1px solid var(--border-main);
        border-radius: inherit;
        pointer-events: none;
        opacity: .42;
        transition: opacity .4s ease;
      }
      body[data-yd-view="services"] .yd-service-door-content {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        min-height: 365px;
        padding: 28px 18px 24px;
        border-radius: inherit;
        background:
          radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--brand-accent) 9%, transparent), transparent 48%),
          linear-gradient(180deg, var(--bg-sub) 0%, var(--bg-card) 100%);
        opacity: 1 !important;
        transform: none !important;
        transition: background .35s ease;
      }
      body[data-yd-view="services"] .yd-service-door-content::before {
        content: none !important;
        display: none !important;
      }
      body[data-yd-view="services"] .yd-service-door-content > * {
        opacity: 1 !important;
        transition: opacity .3s ease;
      }
      body[data-yd-view="services"] .yd-service-door-card:hover::before,
      body[data-yd-view="services"] .yd-service-door-card:focus-visible::before,
      body[data-yd-view="services"] .yd-service-door-card.yd-door-opening::before,
      body[data-yd-view="services"] .yd-service-door-card.yd-door-open::before {
        transform: perspective(1500px) rotateY(-106deg);
        filter: brightness(1.18);
        opacity: .38;
      }
      body[data-yd-view="services"] .yd-service-door-card:hover::after,
      body[data-yd-view="services"] .yd-service-door-card:focus-visible::after,
      body[data-yd-view="services"] .yd-service-door-card.yd-door-opening::after,
      body[data-yd-view="services"] .yd-service-door-card.yd-door-open::after {
        opacity: .08;
      }
      body[data-yd-view="services"] .yd-service-door-card:hover .yd-service-door-content,
      body[data-yd-view="services"] .yd-service-door-card:focus-visible .yd-service-door-content,
      body[data-yd-view="services"] .yd-service-door-card.yd-door-opening .yd-service-door-content,
      body[data-yd-view="services"] .yd-service-door-card.yd-door-open .yd-service-door-content {
        background:
          radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--brand-accent) 15%, transparent), transparent 52%),
          linear-gradient(180deg, var(--bg-sub) 0%, var(--bg-card) 100%);
      }
      @media (max-width: 1100px) {
        body[data-yd-view="services"] #services .grid {
          grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
        }
        body[data-yd-view="services"] #services .grid > div.yd-service-door-card,
        body[data-yd-view="services"] .yd-service-door-content {
          min-height: 340px;
        }
      }
      @media (max-width: 720px) {
        body[data-yd-view="services"] #services .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        }
        body[data-yd-view="services"] #services .grid > div.yd-service-door-card,
        body[data-yd-view="services"] .yd-service-door-content {
          min-height: 330px;
        }
      }
      @media (max-width: 480px) {
        body[data-yd-view="services"] #services .grid {
          grid-template-columns: minmax(0, 1fr) !important;
          max-width: 360px;
          margin-inline: auto;
        }
        body[data-yd-view="services"] #services .grid > div.yd-service-door-card,
        body[data-yd-view="services"] .yd-service-door-content {
          min-height: 380px;
        }
        body[data-yd-view="services"] #services .grid > div.yd-service-door-card {
          border-radius: 180px 180px 8px 8px !important;
        }
      }
      @media (hover: none) {
        body[data-yd-view="services"] .yd-service-door-card {
          cursor: pointer;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        body[data-yd-view="services"] .yd-service-door-card,
        body[data-yd-view="services"] .yd-service-door-card::before,
        body[data-yd-view="services"] .yd-service-door-card::after,
        body[data-yd-view="services"] .yd-service-door-content {
          transition-duration: .01ms !important;
        }
      }

      @media (max-width: 640px) {
        #floating-dock {
          width: calc(100vw - 12px);
          bottom: calc(7px + env(safe-area-inset-bottom));
          gap: 1px;
          padding: 4px;
        }
        .dock-item { height: 38px; }
        .dock-item svg { width: 16px; height: 16px; }
        .dock-tooltip { display: none; }
      }
      @media (max-width: 350px) {
        #floating-dock { width: calc(100vw - 8px); padding: 3px; }
        .dock-item { height: 34px; }
        .dock-item svg { width: 15px; height: 15px; }
      }

      /* ── Back to Top Button ── */
      #yeh-top {
        position: fixed;
        bottom: 74px;
        right: 18px;
        z-index: 9987;
        width: 38px; height: 38px;
        background: var(--bg-card);
        border: 1px solid var(--border-main);
        color: var(--brand-accent);
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: all .25s ease;
        opacity: 0;
        pointer-events: none;
        transform: translateY(8px);
        box-shadow: 0 4px 16px rgba(0,0,0,0.25);
        cursor: pointer;
      }
      #yeh-top.visible {
        opacity: 1;
        pointer-events: all;
        transform: translateY(0);
      }
      #yeh-top:hover {
        background: #B6FF00;
        color: #000;
        border-color: #B6FF00;
        box-shadow: 0 0 20px rgba(182,255,0,.35);
        transform: translateY(-2px);
      }

      /* ── Toast Notifications ── */
      #yeh-toasts {
        position: fixed;
        bottom: 18px;
        left: 18px;

          var titles = Array.prototype.slice.call(grid.querySelectorAll('h3')).map(function(node) {

          });
          return serviceTitleMatchers.filter(function(expected) {
            return titles.some(function(actual) { return actual.includes(expected); });

      // ─────────────────────────────────────────────────
      //  5. DOCK CLICK & SCROLL-SPY ENGINE
      // ─────────────────────────────────────────────────
      function enhanceServiceDoorCards() {
        if (document.body.getAttribute('data-yd-view') !== 'services') return;
        var section = document.getElementById('services');
        if (!section) return;

        var heading = section.querySelector('h2');
        if (heading && !heading.textContent.includes('MAGIC HAPPENS')) {
          heading.innerHTML = 'MAGIC HAPPENS<br><span class="text-[#B6FF00]">BEHIND THE DOORS.</span>';
        }
        var eyebrow = section.querySelector('span.text-xs.font-black');
        if (eyebrow && eyebrow.textContent.trim() !== 'THE CREATIVE COLLECTION') {
          eyebrow.textContent = 'THE CREATIVE COLLECTION';
        }
        var intro = section.querySelector(':scope > div:first-child p');
        if (intro) {
          intro.textContent = 'Choose a door. Step inside to discover the creative services, deliverables, and ideas we can bring to life for your brand.';
        }

        section.querySelectorAll('.grid > div').forEach(function(card, index) {
          var titleNode = card.querySelector('h3');
          var content = card.firstElementChild;
          if (!titleNode || !content) return;

          var numberNode = card.querySelector('span.text-2xl');
          var title = titleNode.textContent.trim();
          var number = numberNode ? numberNode.textContent.trim() : String(index + 1).padStart(2, '0');

          card.classList.add('yd-service-door-card');
          content.classList.add('yd-service-door-content');
          card.setAttribute('data-door-title', title);
          card.setAttribute('data-door-number', number);
          card.setAttribute('data-door-index', String(index + 1));
          card.setAttribute('tabindex', '0');
          card.setAttribute('role', 'button');
          card.setAttribute('aria-label', 'View ' + title + ' service details');
          card.setAttribute('aria-haspopup', 'dialog');

          if (card.dataset.ydServiceDoor !== 'ready') {
            card.dataset.ydServiceDoor = 'ready';

            // Desktop hover previews the room; tapping/clicking opens the existing service dialog.
            card.addEventListener('click', function() {
              card.classList.add('yd-door-opening');
              window.setTimeout(function() {
                card.classList.remove('yd-door-opening');
              }, 760);
            }, true);

            card.addEventListener('keydown', function(event) {
              if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                card.click();
              }
            });

            card.addEventListener('touchstart', function() {
              card.classList.add('yd-door-open');
            }, { passive: true });
            card.addEventListener('touchend', function() {
              window.setTimeout(function() { card.classList.remove('yd-door-open'); }, 850);
            }, { passive: true });
            card.addEventListener('touchcancel', function() {
              card.classList.remove('yd-door-open');
            }, { passive: true });
          }
        });
      }

      function setupDockNavigation() {
        var dock = document.getElementById('floating-dock');
        if (!dock) return;

        var routes = {
          home: '/',
          about: '/about',
          services: '/services',
          work: '/gallery',
          video: '/video',
          courses: '/courses',
          estimate: '/estimate',
          contact: '/contact',
          admin: '/admin/login'
        };
        var currentPath = window.location.pathname || '/';
        var activeTarget = currentPath === '/' || currentPath === '/index.html' ? 'home' :
          currentPath === '/services' ? 'services' :
          currentPath === '/estimate' ? 'estimate' :
          currentPath === '/about' ? 'about' :
          currentPath === '/gallery' ? 'work' :
          currentPath === '/video' ? 'video' :
          currentPath.indexOf('/courses') === 0 ? 'courses' :
          currentPath === '/contact' ? 'contact' :
          currentPath.indexOf('/admin') === 0 ? 'admin' : '';

        dock.querySelectorAll('.dock-item').forEach(function(item) {
          var target = item.getAttribute('data-target');
          if (routes[target]) item.setAttribute('href', routes[target]);
          item.classList.toggle('active', target === activeTarget);
        });
      }

      function setActiveDockItem(targetId) {
        var dock = document.getElementById('floating-dock');
        if (!dock) return;
        var items = dock.querySelectorAll('.dock-item');
        items.forEach(function(el) {
          if (el.getAttribute('data-target') === targetId) {
            el.classList.add('active');
          } else {
            el.classList.remove('active');
          }
        });
      }

      function setupScrollSpy() {
        var sectionIds = ['home', 'about', 'services', 'work', 'estimate', 'contact'];
        var observerOptions = {
          root: null,
          rootMargin: '-20% 0px -60% 0px',
          threshold: 0
        };

        var observer = new IntersectionObserver(function(entries) {
          entries.forEach(function(entry) {
            if (entry.isIntersecting && entry.target.id) {
              setActiveDockItem(entry.target.id);
            }
          });
        }, observerOptions);

        sectionIds.forEach(function(id) {
          var el = document.getElementById(id);
          if (el) observer.observe(el);
        });
      }

      // ─────────────────────────────────────────────────
      //  6. PAGE LIFECYCLE & MUTATION OBSERVER
      // ─────────────────────────────────────────────────
      var loader = document.getElementById('yeh-loader');
      function dismissLoader() {
        if (!loader || loader.dataset.ydDismissed === 'true') return;
        loader.dataset.ydDismissed = 'true';

        // Never make the entire website depend on GSAP loading successfully.
        // The CSS class fades the overlay; the timeout removes it from hit-testing.
        loader.classList.add('hidden');
        window.setTimeout(function() {
          if (loader) {
            loader.style.display = 'none';
            loader.setAttribute('aria-hidden', 'true');
          }
        }, 450);
      }

      var deferredYehuluInstallPrompt = null;

      function setupYehuluInstallButton() {
        if (!deferredYehuluInstallPrompt) return;
        var actions = document.querySelector('.topbar-actions');
        if (!actions || document.getElementById('yd-install-app')) return;

        var installButton = document.createElement('button');
        installButton.type = 'button';
        installButton.id = 'yd-install-app';
        installButton.className = 'theme-toggle-btn';
        installButton.setAttribute('aria-label', 'Install Yehulu Digital');
        installButton.setAttribute('title', 'Install Yehulu Digital on this device');
        installButton.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg>';
        installButton.addEventListener('click', async function() {
          if (!deferredYehuluInstallPrompt) return;
          deferredYehuluInstallPrompt.prompt();
          try { await deferredYehuluInstallPrompt.userChoice; } catch (_) {}
          deferredYehuluInstallPrompt = null;
          installButton.remove();
        });
        actions.appendChild(installButton);
      }

      window.addEventListener('beforeinstallprompt', function(event) {
        event.preventDefault();
        deferredYehuluInstallPrompt = event;
        setupYehuluInstallButton();
      });

      window.addEventListener('appinstalled', function() {
        deferredYehuluInstallPrompt = null;
        var installButton = document.getElementById('yd-install-app');
        if (installButton) installButton.remove();
      });

      var projectImageObserver = null;
      function enhanceProjectsGallery() {
        if (document.body.getAttribute('data-yd-view') !== 'projects') return;
        var main = document.querySelector('#root main');
        if (!main) return;

        var projectGrid = Array.prototype.slice.call(main.querySelectorAll('.grid')).find(function(grid) {
          return Array.prototype.slice.call(grid.children).some(function(card) {
            return card.querySelector('img');
          });
        });
        if (!projectGrid) return;

        if (!projectImageObserver && 'IntersectionObserver' in window && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          projectImageObserver = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
              if (!entry.isIntersecting) return;
              entry.target.classList.add('yd-project-revealed');
              projectImageObserver.unobserve(entry.target);
            });
          }, { threshold: 0.14, rootMargin: '0px 0px -5% 0px' });
        }

        Array.prototype.slice.call(projectGrid.children).forEach(function(card, index) {
          var image = card.querySelector('img');
          if (!image) return;
          var imagePath = image.getAttribute('src') || '';
          if (!imagePath.trim()) return;
          card.classList.add('yd-project-image-card');
          card.style.setProperty('--yd-project-delay', (index % 8) * 65 + 'ms');
          if (card.dataset.ydProjectReveal === 'ready') return;
          card.dataset.ydProjectReveal = 'ready';

          if (!projectImageObserver) {
            card.classList.add('yd-project-revealed');
          } else {
            projectImageObserver.observe(card);
          }
        });
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').catch(function(error) {
            console.warn('Yehulu offline support could not be registered:', error);
          });
        });
      }

      var rootElement = document.getElementById('root');
      var observer = new MutationObserver(function() {
        injectTopbarActions();
        assignSectionIds();
        setupDockNavigation();
        setupYehuluInstallButton();
        enhanceServiceDoorCards();
        enhanceProjectsGallery();
        dismissLoader();
      });

      if (rootElement) {
        observer.observe(rootElement, { childList: true, subtree: true });
      }

      window.addEventListener('load', function() {
        setTimeout(function() {
          injectTopbarActions();
          assignSectionIds();
          setupDockNavigation();
          setupYehuluInstallButton();
          enhanceServiceDoorCards();
          enhanceProjectsGallery();
          dismissLoader();
        }, 500);
      });

      // ─────────────────────────────────────────────────
      //  7. PROGRESS BAR & BACK TO TOP
      // ─────────────────────────────────────────────────
      var progressBar = document.getElementById('yeh-progress');
      var topBtn = document.getElementById('yeh-top');

      window.addEventListener('scroll', function() {
        var scrollTop = window.scrollY;
        var docHeight = document.documentElement.scrollHeight - window.innerHeight;
        var pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        if (progressBar) progressBar.style.width = pct + '%';

        if (topBtn) {
          if (scrollTop > 400) {
            topBtn.classList.add('visible');
          } else {
            topBtn.classList.remove('visible');
          }
        }
      }, { passive: true });

      // ─────────────────────────────────────────────────
      //  8. TOAST SYSTEM
      // ─────────────────────────────────────────────────
      var toastsContainer = document.getElementById('yeh-toasts');
      window.yehToast = function(message, type, duration) {
        type = type || 'info';
        duration = duration || 3000;
        var toast = document.createElement('div');
        toast.className = 'yeh-toast ' + type;
        toast.innerHTML = '<div class="toast-dot"></div><span>' + message + '</span>';
        if (toastsContainer) toastsContainer.appendChild(toast);

        setTimeout(function() {
          toast.classList.add('removing');
          setTimeout(function() { toast.remove(); }, 300);
        }, duration);

        return toast;
      };

      // ─────────────────────────────────────────────────

      // ─────────────────────────────────────────────────
      window.yehuluGallery = [];
      window.currentLightboxIndex = 0;

      function updateLightboxView() {
        if (!window.yehuluGallery || !window.yehuluGallery.length) return;
        var item = window.yehuluGallery[window.currentLightboxIndex];
        if (!item) return;

        var imgEl = document.getElementById('lightbox-img');
        var titleEl = document.getElementById('lightbox-title');
        var catEl = document.getElementById('lightbox-category');

        if (imgEl) {
          imgEl.src = safeGalleryImageUrl(item.imageUrl);
          imgEl.alt = item.title || 'Project Preview';
        }
        if (titleEl) {
          titleEl.textContent = item.title || '';
        }
        if (catEl) {
          var clientInfo = item.client ? ' • ' + item.client : '';
          catEl.textContent = (item.category || 'COMMERCIAL') + clientInfo + ' (' + (window.currentLightboxIndex + 1) + '/' + window.yehuluGallery.length + ')';
        }
      }

      function openLightbox(index) {
        var modal = document.getElementById('project-lightbox');
        if (!modal) return;
        window.currentLightboxIndex = typeof index === 'number' ? index : 0;
        updateLightboxView();
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        var modal = document.getElementById('project-lightbox');
        if (!modal) return;
        modal.classList.remove('active');
        document.body.style.overflow = '';
      }

      function nextLightbox() {
        if (!window.yehuluGallery.length) return;
        window.currentLightboxIndex = (window.currentLightboxIndex + 1) % window.yehuluGallery.length;
        updateLightboxView();
      }

      function prevLightbox() {
        if (!window.yehuluGallery.length) return;
        window.currentLightboxIndex = (window.currentLightboxIndex - 1 + window.yehuluGallery.length) % window.yehuluGallery.length;
        updateLightboxView();
      }

      function setupLightboxControls() {
        var closeBtn = document.getElementById('lightbox-close');
        var prevBtn = document.getElementById('lightbox-prev');
        var nextBtn = document.getElementById('lightbox-next');
        var modal = document.getElementById('project-lightbox');

        if (closeBtn) closeBtn.onclick = function(e) { e.stopPropagation(); closeLightbox(); };
        if (prevBtn) prevBtn.onclick = function(e) { e.stopPropagation(); prevLightbox(); };
        if (nextBtn) nextBtn.onclick = function(e) { e.stopPropagation(); nextLightbox(); };

        if (modal) {
          modal.onclick = function(e) {
            if (e.target === modal || e.target.id === 'project-lightbox') {
              closeLightbox();
            }
          };
        }

        window.addEventListener('keydown', function(e) {
          var modal = document.getElementById('project-lightbox');
          if (!modal || !modal.classList.contains('active')) return;
          if (e.key === 'Escape') closeLightbox();
          else if (e.key === 'ArrowRight') nextLightbox();
          else if (e.key === 'ArrowLeft') prevLightbox();
        });
      }

          var year = document.createElement('span');
          year.className = 'archive-card-year';
          year.textContent = String(item.year || '2026');
          footer.appendChild(client);
          footer.appendChild(year);
          cardBody.appendChild(footer);
          card.appendChild(cardBody);
          archiveGrid.appendChild(card);
        });

        if (total > 12) {
          var loadMore = archiveWrapper.querySelector('#archive-load-more-btn');
          loadMore.querySelector('span').textContent = 'LOAD ALL ' + total + ' PROJECTS';
          loadMore.addEventListener('click', window.expandAllArchiveItems);
        }

        workSection.appendChild(archiveWrapper);
      }

      window.expandAllArchiveItems = function() {
        var overflowCards = document.querySelectorAll('#archive-items-grid .archive-card[data-overflow="true"]');
        overflowCards.forEach(function(c) {
          c.style.display = 'flex';
          c.removeAttribute('data-overflow');
        });
        var btnWrap = document.getElementById('archive-load-more-wrap');
        if (btnWrap) btnWrap.style.display = 'none';
      };

      window.filterArchiveCategory = function(cat) {
        var buttons = document.querySelectorAll('.archive-cat-btn');
        buttons.forEach(function(btn) {
          if (btn.getAttribute('data-cat') === cat) {
            btn.className = 'archive-cat-btn text-[11px] font-extrabold uppercase tracking-wider px-3 py-1.5 border transition-all bg-[#B6FF00] text-black border-[#B6FF00]';
          } else {
            btn.className = 'archive-cat-btn text-[11px] font-extrabold uppercase tracking-wider px-3 py-1.5 border transition-all bg-zinc-950 text-gray-400 border-white/10 hover:border-white/30 hover:text-white';
          }
        });

        // If filtering by specific category, reveal all cards matching it
        var cards = document.querySelectorAll('#archive-items-grid .archive-card');
        var btnWrap = document.getElementById('archive-load-more-wrap');
        if (cat !== 'ALL' && btnWrap) {
          btnWrap.style.display = 'none';
        }

        cards.forEach(function(card) {
          var cardCat = (card.getAttribute('data-category') || '').toUpperCase();
          if (cat === 'ALL') {
            if (card.hasAttribute('data-overflow')) {
              card.style.display = 'none';
            } else {
              card.style.display = 'flex';
            }
          } else if (cardCat.includes(cat.toUpperCase()) || (cat === 'COMMERCIAL' && cardCat.includes('PHOTO'))) {
            card.style.display = 'flex';
          } else {
            card.style.display = 'none';
          }
        });
      };

      function wireCardClicks() {
        // Wire React-rendered work cards to lightbox
        var workEl = document.getElementById('work');
        if (!workEl) return;

        var reactCards = workEl.querySelectorAll('.aspect-\\[4\\/5\\]');
        reactCards.forEach(function(card) {
          var img = card.querySelector('img');
          if (img && !card.dataset.lightboxWired) {
            card.dataset.lightboxWired = 'true';
            card.addEventListener('click', function(e) {
              var src = img.getAttribute('src');
              var foundIndex = window.yehuluGallery.findIndex(function(it) {
                return it.imageUrl === src;
              });
              if (foundIndex !== -1) {
                e.preventDefault();
                e.stopPropagation();
                openLightbox(foundIndex);
              }
            }, true);
          }
        });
      }

      // Check on mutation and after mount
      setupLightboxControls();
      initGalleryArchive();

      var pollGalleryMount = setInterval(function() {
        if (document.getElementById('work')) {
          initGalleryArchive();
          wireCardClicks();
          clearInterval(pollGalleryMount);
        }
      }, 500);
    </script>
  </body>
</html>
